{% extends 'base.html' %}

{% block title %}Welcome -- Get Form{% endblock %}

{% block body %}
    <h2>Welcome get form</h2>
    <label>
        Name:
        <input type="text" id="name">
    </label>
    <br><br>
    <label>
        Age:
        <input type="number" id="age">
    </label>
    <br><br>
    <button onclick="submitForm()">Submit</button>
    <p id="message"></p>

    <script>
        function submitForm() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;

            const params = new URLSearchParams();
            params.append('name', name);
            params.append('age', age);

            const url = `/v1/get/form?${params.toString()}`;
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    const messageEl = document.getElementById('message');
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        messageEl.textContent = response.message;
                        messageEl.style.color = '#1a7f37';
                    } else {
                        let errText = xhr.responseText;
                        try {
                            const errJson = JSON.parse(xhr.responseText);
                            errText = errJson.error || errJson.message || errText;
                        } catch (e) {}
                        messageEl.textContent = errText;
                        messageEl.style.color = '#cf222e';
                    }
                }
            };
            xhr.send();
        }
    </script>
{% endblock %}
