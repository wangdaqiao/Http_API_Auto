{% extends 'base.html' %}

{% block title %}Flask XHR Example - 502err{% endblock %}

{% block body %}
    <h1>post json 502 err</h1>
    <label>
        please enter your name
    </label>
    <br><br>
    <input type="text" id="name" placeholder="Enter your name">
    <br><br>
    <button onclick="submitName()">Submit</button>
    <br><br>
    <div id="error-message"></div>

    <script>
        function submitName() {
            const xhr = new XMLHttpRequest();
            const name = document.getElementById('name').value;
            xhr.open('POST', '/v1/post/err502', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            const data = { name: name };
            xhr.send(JSON.stringify(data));
            xhr.onload = function() {
                if (xhr.status === 502) {
                    const errorMessage = document.getElementById('error-message');
                    let errMsg = xhr.responseText;
                    try {
                        const res = JSON.parse(xhr.responseText);
                        errMsg = res.error || res.message || xhr.responseText;
                    } catch (e) {}
                    errorMessage.textContent = 'Error 502: ' + errMsg;
                }
            };
        }
    </script>
{% endblock %}
